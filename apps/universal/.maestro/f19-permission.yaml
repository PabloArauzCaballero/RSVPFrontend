appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- openLink: "rsvp://permisos-push?c=${CELEBRATION_ID}"
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- tapOn:
    id: login-email
- inputText: ${QA_EMAIL}
- tapOn:
    id: login-password
- inputText: ${QA_PASSWORD}
- hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: enable-push
    timeout: 20000
- assertVisible: "Te avisamos cuando alguien confirme o pida acompañantes.*|We tell you when someone confirms or asks for companions.*"
- tapOn:
    id: enable-push
- tapOn: "^(Permitir|Allow)$"
- extendedWaitUntil:
    visible:
      id: disable-push
    timeout: 30000
- assertVisible: "Este dispositivo está registrado para recibir avisos push.*|This device is registered for push notices.*"
- takeScreenshot: f19-permission-registered
