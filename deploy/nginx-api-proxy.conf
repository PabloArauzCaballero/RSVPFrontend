# L20 · The /api/ proxy, shared by the two /api/ locations of nginx-spa.conf (ordinary paths and guest credential paths,
# which differ only in their error log). Rendered like nginx-spa.conf by deploy/render-nginx-spa.sh and installed as
# /etc/nginx/snippets/api-proxy.conf (Dockerfile.universal). Location context.
# Build-time upstream (EXPO_PUBLIC_API_URL); web auth cookies stay first-party even when Kong has another domain.
# L19 · The host is resolved per request through the variable (resolver in nginx-spa.conf), never at startup.
set $rsvp_api_origin ${RSVP_API_ORIGIN};
# With a variable, proxy_pass no longer swaps the location prefix: the rewrite strips /api (and prepends the base path
# of the upstream URL, if any) exactly as `proxy_pass <url>/;` did. The query string is kept; (?s) keeps a decoded
# newline (%0A) inside the captured path.
rewrite "(?s)^/api(/.*)$" ${RSVP_API_BASE_PATH}$1 break;
proxy_pass $rsvp_api_origin;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_set_header Host $proxy_host;
# Tell the gateway who the visitor is (one value, never the client's own list): Kong rate-limits per visitor.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_cookie_path /identity/auth /api/identity/auth;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
add_header Cache-Control "no-store" always;
include /etc/nginx/snippets/security-headers.conf;
add_header Referrer-Policy "no-referrer" always;
gzip off;
