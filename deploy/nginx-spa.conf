server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # B1 · The visitor reaches nginx through Coolify's Traefik (a private Docker address). Trust X-Forwarded-For only from
  # private addresses and take the right-most untrusted entry: $remote_addr becomes the visitor, a forged entry is ignored.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # Fixed build-time upstream; web auth cookies stay first-party even when Kong has another domain.
  location /api/ {
    proxy_pass ${RSVP_API_UPSTREAM}/;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host $proxy_host;
    # Tell the gateway who the visitor is (one value, never the client's own list): Kong rate-limits per visitor.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cookie_path /identity/auth /api/identity/auth;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Cache-Control "no-store" always;
  }
  location /_expo/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri.html /index.html; }
  location = /health { return 200 'ok'; add_header Content-Type text/plain; }
}
