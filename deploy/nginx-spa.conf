# A13 · Guest links carry their credential in the path (/rsvp/{token}, /c/{slug}/rsvp/{token}, /c/{slug}/regalos/{ref}).
# The access log never writes it: those paths are replaced by a fixed marker, the query string is never logged (reset and
# verification links carry ?token=) and neither is the client address. Same spirit as Kong's rsvp_safe format. http context
# (this file is included inside http {} as conf.d/default.conf).
# The map reads $request_uri, the path the client sent: at log time $uri is already the SPA fallback (`try_files … /index.html`
# and `rewrite ^ /index.html` in @guest_index), so a map on $uri logged every page as /index.html. $request_uri is raw
# (not decoded or normalised), so the path is logged only when it is plainly safe: guest paths (also through /api/, where
# GET /api/rsvp/{token} carries the same credential) become a marker, plain segments are logged without the query, and
# anything else (percent-encoding, dot segments, `//`) becomes a fixed marker instead of a path that could hide a token.
# Regexes are tried in order; the first match wins.
map $request_uri $rsvp_log_path {
  default "/[unlogged-path]";
  ~*^/(?:api/)?(?:rsvp|c/[^/?]+/(?:rsvp|regalos))(?:[/?]|$) "/[guest-credential-path]";
  ~^(?<rsvp_log_plain_path>(?:/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)*/?)(?:\?|$) $rsvp_log_plain_path;
}
log_format rsvp_safe '$status $request_time $request_method $rsvp_log_path';

server {
  listen 80;
  # A13 · Replaces the image's default `main` format, which logs $request (path and query) and $remote_addr.
  access_log /dev/stdout rsvp_safe;
  root /usr/share/nginx/html;
  index index.html;
  # A6 · No version in Server or error pages; compressed static assets (never the proxied API: BREACH on token responses).
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  # B1 · The visitor reaches nginx through Coolify's Traefik (a private Docker address). Trust X-Forwarded-For only from
  # private addresses and take the right-most untrusted entry: $remote_addr becomes the visitor, a forged entry is ignored.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # L19 · The upstream host is resolved per request, never at startup. A host written in proxy_pass is resolved only when
  # nginx loads its config, so one DNS failure at boot killed the container ([emerg] host not found in upstream). With the
  # host in a variable nginx starts without DNS, serves the SPA, answers 502 on /api/ while the name does not resolve and
  # recovers by itself. 127.0.0.11 is Docker's embedded DNS, present on user-defined networks (Coolify's). Outside one
  # (`docker run` on the default bridge, nginx on a host) a host name upstream gives 502 on /api/: use an IP or a user
  # network (`docker network create`). Answers are cached for 30 s; IPv4 only, like the rest of the VPS traffic (B19).
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;
  # The proxy itself (upstream, rewrite, TLS, Host, visitor address, cookie path, headers) lives in api-proxy.conf
  # (deploy/nginx-api-proxy.conf), rendered with the same upstream as this file.
  location /api/ {
    include /etc/nginx/snippets/api-proxy.conf;
    # L20 · When the upstream fails (connection refused, DNS, timeout, TLS) nginx writes the request line to the error log
    # (stderr), and on guest paths that line carries the credential (GET /api/rsvp/{token}). The same paths the access log
    # redacts (A13's map, /[guest-credential-path]) keep only emerg here: nginx never logs a request at that level, so no
    # line of theirs is written, while every other /api/ path keeps its error log. Not `crit`: a failed TLS handshake with
    # the upstream is logged at crit with the request. The access log still records these failures (status 502/504).
    # Matched on the normalised path, so %72svp, //rsvp and dot segments land here too; case-insensitive like the map.
    location ~* ^/api/(?:rsvp|c/[^/]+/(?:rsvp|regalos))(?:/|$) {
      error_log /dev/stderr emerg;
      include /etc/nginx/snippets/api-proxy.conf;
    }
  }
  location /_expo/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store";
  }
  # A6 · Guest links carry their credential in the path (/rsvp/{token}, /c/{slug}/rsvp/{token}, /c/{slug}/regalos/{ref}):
  # never sent in a Referer, never cached by a shared cache.
  location ~ ^/(?:rsvp|c/[^/]+/(?:rsvp|regalos))(?:/|$) {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri.html @guest_index;
  }
  # The SPA fallback of credential paths. A plain `/index.html` fallback would jump to `location = /index.html` and lose
  # the no-referrer header above (nginx keeps only the add_header of the final location).
  location @guest_index {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    rewrite ^ /index.html break;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri.html /index.html;
  }
  location = /health { default_type text/plain; return 200 'ok'; }
}
