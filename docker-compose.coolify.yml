# Despliegue web de RSVP en Coolify (TEST en Contabo y produccion; cada entorno con sus propias variables). Build context = raiz del repo; sin bind mounts (Coolify no los materializa).
# Dos servicios publicos, cada uno con su dominio en Coolify: universal (app Expo web) y seo-web (sitio publico y enlaces de RSVP).
# Las URLs son argumentos de build porque se incrustan en el JS: deben ser variables buildtime en Coolify.
# universal: EXPO_PUBLIC_SITE_URL = dominio de seo-web (sirve /r/{listingId} y las paginas indexables; TEST: https://rsvp-web.161.97.85.216.sslip.io);
#            EXPO_PUBLIC_RSVP_ORIGIN = dominio de los enlaces personales de RSVP (TEST: https://dev.done.arauzsoftware.com).
#            Si la app y el sitio viven en dominios distintos, SITE_URL es obligatoria: sin ella los enlaces a proveedores irian al dominio de la app, que no tiene /r.
name: rsvp-web
services:
  universal:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.universal
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
        EXPO_PUBLIC_SITE_URL: ${EXPO_PUBLIC_SITE_URL}
        EXPO_PUBLIC_RSVP_ORIGIN: ${EXPO_PUBLIC_RSVP_ORIGIN}
        # Opcional (OSM): plantilla https con {z}/{x}/{y}; vacia = tile.openstreetmap.org.
        EXPO_PUBLIC_MAP_TILE_URL: ${EXPO_PUBLIC_MAP_TILE_URL:-}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  seo-web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.seo-web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      # Server-side calls (/r) go to the gateway. RSVP_API_INTERNAL_URL (optional) points them at Kong over a shared Docker
      # network instead of the public domain, so no second Traefik hop can drop the visitor address (B1).
      RSVP_API_URL: ${RSVP_API_INTERNAL_URL:-${NEXT_PUBLIC_API_URL}}
      # Proxies in front of seo-web whose X-Forwarded-For entry is trusted (Traefik = 1). The visitor address is forwarded to Kong.
      SEO_WEB_TRUSTED_PROXY_HOPS: ${SEO_WEB_TRUSTED_PROXY_HOPS:-1}
      # Universal links / App Links (/.well-known/apple-app-site-association y assetlinks.json). Runtime, no build: sin las
      # tres, las dos rutas responden 404 a proposito (packages/auth/src/deep-links/verification.ts). Coolify solo entrega
      # al contenedor las variables declaradas aqui. RSVP_APPLE_APP_ID = <TEAM_ID>.com.arauzsoftware.done;
      # RSVP_ANDROID_PACKAGE = com.arauzsoftware.done; RSVP_ANDROID_SHA256_FINGERPRINTS = huellas SHA-256 de la firma, por comas.
      RSVP_APPLE_APP_ID: ${RSVP_APPLE_APP_ID:-}
      RSVP_ANDROID_PACKAGE: ${RSVP_ANDROID_PACKAGE:-}
      RSVP_ANDROID_SHA256_FINGERPRINTS: ${RSVP_ANDROID_SHA256_FINGERPRINTS:-}
      # «Proveedores para tu evento» (/c/{slug}/proveedores y sus entradas): runtime, apagado por defecto. Solo el valor `on` lo enciende; sin el
      # backend provider-catalog 3.15.0+ la pagina muestra su estado de error. Ver docs/progress/marketplace-invitado-fe.md.
      GUEST_MARKETPLACE: ${GUEST_MARKETPLACE:-off}
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
