# Despliegue web de RSVP en Coolify (Contabo TEST). Build context = raiz del repo; sin bind mounts (Coolify no los materializa).
# Dos servicios publicos, cada uno con su dominio en Coolify: universal (app Expo web) y seo-web (sitio publico y enlaces de RSVP).
# Las URLs son argumentos de build porque se incrustan en el JS: deben ser variables buildtime en Coolify.
name: rsvp-web
services:
  universal:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.universal
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
        EXPO_PUBLIC_SITE_URL: ${EXPO_PUBLIC_SITE_URL}
        EXPO_PUBLIC_RSVP_ORIGIN: ${EXPO_PUBLIC_RSVP_ORIGIN}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  seo-web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.seo-web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      RSVP_API_URL: ${NEXT_PUBLIC_API_URL}
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
