name: Frontend CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions: { contents: read }
jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: yarn }
      - run: yarn install --immutable
      - run: yarn harness:validate
      - run: yarn lint:code  # ESLint over the whole repo, including rsvp/no-literal-strings (REQ-F06-06)
      - run: yarn workspace @rsvp/contracts check:generated
      - run: yarn turbo run build lint typecheck test --affected
      # Coverage gate: lines/statements >= 85 % in the packages with logic and both apps (vitest thresholds fail the job below it).
      - run: yarn test:coverage
