name: Lighthouse SEO
on: [pull_request]
permissions: { contents: read }
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: yarn }
      - run: yarn install --immutable
      - run: yarn workspace @rsvp/seo-web build
      - run: yarn workspace @rsvp/seo-web start > /tmp/rsvp-next.log 2>&1 &
      - name: Wait for Next.js
        run: until curl --fail --silent http://localhost:3000; do sleep 1; done
      - uses: treosh/lighthouse-ci-action@v12
        with:
          # configPath (not budgetPath): budgetPath expects a budget.json and ignores `ci.assert`.
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
